>then review the case in one place.</text><rect x="289" y="411" width="235" height="45" rx="12" fill="#8ac6fb"/><text x="310" y="440" font-size="16" fill="#132538">Open repertory →</text><text x="860" y="277" font-size="11" fill="#e4edf4">A CONNECTED PRACTICE</text><text x="860" y="319" font-size="26" fill="#e4edf4">Your books.</text><text x="860" y="351" font-size="26" fill="#e4edf4">Your workflow.</text><text x="860" y="409" font-size="14" fill="#e4edf4">Reference, analysis and reading.</text><text x="285" y="548" font-size="22" fill="#e4edf4">Repertory</text><text x="285" y="582" font-size="14" fill="#e4edf4">Chapter-led browsing</text><text x="590" y="548" font-size="22" fill="#e4edf4">Analysis</text><text x="590" y="582" font-size="14" fill="#e4edf4">Source-aware selections</text><text x="895" y="548" font-size="22" fill="#e4edf4">Library</text><text x="895" y="582" font-size="14" fill="#e4edf4">Remedy references</text><text x="289" y="685" font-size="22" fill="#e4edf4">Keep access in your hands.</text><text x="289" y="718" font-size="15" fill="#e4edf4">Review requests, approve access and revoke it when needed.</text><text x="260" y="782" font-size="12" fill="#e4edf4">DESIGN ILLUSTRATION · Unpublished · Synthetic content · Not a browser screenshot</text></g></svg>