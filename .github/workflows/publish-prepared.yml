name: Publish verified APK release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Prepared release tag (for example v1.19)
        required: true
        type: string
      publish:
        description: Publish after upload (otherwise keep as a draft)
        required: true
        default: false
        type: boolean
permissions:
  contents: write
concurrency:
  group: publish-apk
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Test release retention safeguards
        run: python3 tests/test_release_retention.py
      - name: Verify independently signed release and APK bytes
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 scripts/verify_prepared.py "$RELEASE_TAG"
      - name: Upload the verified files to the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          folder="prepared/$RELEASE_TAG"
          if gh release view "$RELEASE_TAG" --json isDraft > /tmp/release-state.json; then
            python3 -c 'import json; assert json.load(open("/tmp/release-state.json"))["isDraft"], "Refusing to replace a published release"'
          else
            gh release create "$RELEASE_TAG" --draft --target "$GITHUB_SHA" --title "Open Repertory ${RELEASE_TAG#v}" --notes-file "$folder/RELEASE_NOTES.md"
          fi
          assets=("$folder/"*.apk "$folder/update.json" "$folder/RELEASE_NOTES.md" "$folder/SHA256SUMS")
          shopt -s nullglob
          # Do not publish source ZIPs or internal audit snapshots as public release assets.
          for file in "$folder/"TEST_REPORT_*.md "$folder/UPDATE_OWNER_GUIDE.md"; do
            if [[ -f "$file" ]]; then assets+=("$file"); fi
          done
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
      - name: Publish the completed release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
      - name: Retain only the latest five releases
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 scripts/retain_releases.py --repo "$GH_REPO" --apply --prune-prepared
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Retain prepared files for latest five releases'
            gh auth setup-git
            git push origin HEAD:main
          fi
