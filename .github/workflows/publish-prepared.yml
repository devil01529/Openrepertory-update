name: Publish verified APK release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Prepared release tag (for example v1.19)
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: publish-apk
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify independently signed release and APK bytes
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 scripts/verify_prepared.py "$RELEASE_TAG"
      - name: Upload the verified files and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          folder="prepared/$RELEASE_TAG"
          if gh release view "$RELEASE_TAG" --json isDraft > /tmp/release-state.json; then
            python3 -c 'import json; assert json.load(open("/tmp/release-state.json"))["isDraft"], "Refusing to replace a published release"'
          else
            gh release create "$RELEASE_TAG" --draft --target "$GITHUB_SHA" --title "Open Repertory ${RELEASE_TAG#v}" --notes-file "$folder/RELEASE_NOTES.md"
          fi
          gh release upload "$RELEASE_TAG" "$folder/"*.apk "$folder/update.json" "$folder/RELEASE_NOTES.md" "$folder/SHA256SUMS" --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
