name: Similora branding checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  branding:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python3 tests/test_similora_branding.py
      - run: python3 tests/test_release_retention.py
